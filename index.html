<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Techniek Engineering</title>
    <meta
      name="description"
      content="Techniek Engineering provides professional engineering, project management, and energy management support for commercial and industrial clients."
    >
    <meta http-equiv="refresh" content="0; url=outputs/index.html">
    <link rel="canonical" href="outputs/index.html">
    <style>
      :root {
        --techniek-blue: #0060e0;
        --techniek-green: #60d040;
        --charcoal: #24272b;
        --silver: #d8dde3;
        --surface: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f8fb;
        color: var(--charcoal);
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.5;
      }

      main {
        width: min(92vw, 560px);
        padding: 40px;
        border: 1px solid var(--silver);
        border-top: 4px solid var(--techniek-blue);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: 0 18px 50px rgba(36, 39, 43, 0.08);
        text-align: center;
      }

      img {
        width: min(260px, 80%);
        height: auto;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(1.75rem, 5vw, 2.4rem);
        letter-spacing: 0;
      }

      p {
        margin: 0 0 18px;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 12px 18px;
        border-radius: 6px;
        background: var(--techniek-blue);
        color: #ffffff;
        font-weight: 700;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid var(--techniek-green);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="outputs/assets/logo.png" alt="Techniek Engineering logo">
      <h1>Techniek Engineering</h1>
      <p>Opening the Techniek Engineering site.</p>
      <a href="outputs/index.html">Continue to the site</a>
    </main>
    <script>
      window.location.replace("outputs/index.html");
    </script>
  </body>
</html>
