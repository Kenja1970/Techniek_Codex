name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build deploy folder
        run: |
          mkdir -p dist
          cp outputs/*.html dist/
          cp outputs/briefs.json dist/
          cp outputs/briefs.xml dist/
          cp outputs/doe-lab-budgets.json dist/
          cp outputs/robots.txt dist/
          cp outputs/sitemap.xml dist/
          cp outputs/skills.json dist/
          cp outputs/weekly-knowledge-prompts.json dist/
          cp outputs/.nojekyll dist/
          cp -R outputs/assets dist/assets

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
