name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Verify flange calculator
        run: |
          node --check outputs/tools/flange-capacity/app.js
          node --check outputs/tools/flange-capacity/configuration.js
          node --check outputs/tools/flange-capacity/qualification.js
          node outputs/tools/flange-capacity/tests/configuration.test.mjs
          node outputs/tools/flange-capacity/tests/qualification.test.mjs
          node outputs/tools/flange-capacity/tests/publishing.test.mjs

      - name: Verify Techniek OpsBoard
        working-directory: outputs/tools/techniek-opsboard
        run: |
          set -e
          node --check app.js
          node --check tests/qa.js
          for f in index.html styles.css app.js README.md CHANGELOG.md LICENSE .nojekyll \
                   tests/qa.html tests/qa.js docs/qa/QA-REPORT.md \
                   assets/knowledge-corpus.js; do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
          done
          # V2 loads the PM knowledge corpus as a <script> (fetch is blocked on
          # file://). Without it the app still boots but Procedure Q&A silently
          # returns nothing, so fail loudly instead.
          grep -q 'knowledge-corpus.js' index.html || { echo "::error::index.html does not load the knowledge corpus"; exit 1; }
          grep -q 'styles.css?v=' index.html || { echo "::error::index.html missing versioned styles.css"; exit 1; }
          grep -q 'app.js?v='    index.html || { echo "::error::index.html missing versioned app.js"; exit 1; }
          if grep -Eq 'src="/src/|/node_modules/' index.html; then
            echo "::error::index.html references a build-only path"; exit 1
          fi
          APP_VER=$(grep -oE 'APP_VERSION = "[0-9]+\.[0-9]+\.[0-9]+"' app.js | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "OpsBoard version: $APP_VER"
          grep -q "## \[$APP_VER\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no entry for $APP_VER"; exit 1; }
          if grep -RniE 'console\.(log|debug)\(|debugger;|FIXME' app.js; then
            echo "::error::debug marker found in app.js"; exit 1
          fi
          echo "OpsBoard guardrails passed"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build deploy folder
        run: |
          mkdir -p dist
          cp outputs/index.html dist/
          cp outputs/engineering-support.html dist/
          cp outputs/project-management.html dist/
          cp outputs/energy-management.html dist/
          cp outputs/support-finder.html dist/
          cp outputs/archive.html dist/
          cp -R outputs/tools dist/tools
          rm -rf dist/tools/flange-capacity/tests
          rm -f dist/tools/flange-capacity/CHANGELOG.md
          rm -f dist/tools/flange-capacity/qualification-packages-compact-4in-600.md
          rm -rf dist/tools/techniek-opsboard/.git dist/tools/techniek-opsboard/.github
          cp outputs/briefs.json dist/
          cp outputs/briefs.xml dist/
          cp outputs/doe-lab-budgets.json dist/
          cp outputs/robots.txt dist/
          cp outputs/sitemap.xml dist/
          cp outputs/skills.json dist/
          cp outputs/weekly-knowledge-prompts.json dist/
          cp outputs/.nojekyll dist/
          cp -R outputs/assets dist/assets

      - name: Verify deploy artifact
        run: |
          test -f dist/index.html
          test -f dist/sitemap.xml
          test -f dist/tools/flange-capacity/index.html
          test -f dist/tools/flange-capacity/agent-manifest.json
          test -f dist/tools/techniek-opsboard/index.html
          test -f dist/tools/techniek-opsboard/app.js
          test -f dist/tools/techniek-opsboard/assets/knowledge-corpus.js
          test -f dist/tools/techniek-twinsim-studio/index.html
          test -f dist/tools/precisionflow/index.html
          test -n "$(find dist/tools/precisionflow/assets -name 'index-*.js' -print -quit)"
          test -f dist/tools/greg-brown-site/index.html
          # Career site must use relative asset paths so it serves from both
          # kenja1970.github.io/Techniek_Codex/... and the Cloudflare domain.
          if grep -q '"/Techniek_Codex/' dist/tools/greg-brown-site/index.html; then
            echo "::error::greg-brown-site has host-specific absolute asset paths"; exit 1
          fi

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
