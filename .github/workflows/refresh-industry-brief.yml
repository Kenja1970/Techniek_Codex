name: Refresh Industry Brief

on:
  schedule:
    - cron: "35 12 * * *"
    - cron: "35 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-industry-brief
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh brief feed
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
        run: python tools/refresh_industry_brief.py

      - name: Commit and push feed update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/briefs.json outputs/briefs.xml
          if git diff --cached --quiet -- outputs/briefs.json outputs/briefs.xml; then
            echo "No feed changes to commit."
            exit 0
          fi
          brief_date=$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("outputs/briefs.json").read_text(encoding="utf-8-sig"))
          print(data["items"][0]["date"])
          PY
          )
          git commit -m "Refresh Industry Brief for ${brief_date}"
          git push origin HEAD:main
