name: Refresh Industry Brief

on:
  schedule:
    # 11:30 PM EDT / 10:30 PM EST. GitHub schedules use UTC.
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-industry-brief
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify OpenAI API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "::error title=Missing OPENAI_API_KEY::Add the OPENAI_API_KEY repository secret under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refresh brief feed
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
        run: python tools/refresh_industry_brief.py

      - name: Commit and push feed update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/briefs.json outputs/briefs.xml
          if git diff --cached --quiet -- outputs/briefs.json outputs/briefs.xml; then
            echo "No feed changes to commit."
            exit 0
          fi
          brief_date=$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("outputs/briefs.json").read_text(encoding="utf-8-sig"))
          print(data["items"][0]["date"])
          PY
          )
          git commit -m "Refresh Industry Brief for ${brief_date}"
          git push origin HEAD:main
