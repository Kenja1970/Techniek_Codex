# Deployment lives on Cloudflare Pages (see wrangler.toml). This workflow only
# verifies the build; it publishes nothing.
name: Verify site and engineering tools

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install PrecisionFlow dependencies
        run: npm ci --prefix tools/Techniek-PrecisionFlow

      - name: Verify site and engineering tools
        run: npm run check

      - name: Verify Techniek OpsBoard
        working-directory: outputs/tools/techniek-opsboard
        run: |
          set -e
          node --check app.js
          node --check tests/qa.js
          for f in index.html styles.css app.js README.md CHANGELOG.md LICENSE .nojekyll \
                   tests/qa.html tests/qa.js docs/qa/QA-REPORT.md \
                   assets/knowledge-corpus.js; do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
          done
          # V2 loads the PM knowledge corpus as a <script> (fetch is blocked on
          # file://). Without it the app still boots but Procedure Q&A silently
          # returns nothing, so fail loudly instead.
          grep -q 'knowledge-corpus.js' index.html || { echo "::error::index.html does not load the knowledge corpus"; exit 1; }
          grep -q 'styles.css?v=' index.html || { echo "::error::index.html missing versioned styles.css"; exit 1; }
          grep -q 'app.js?v='    index.html || { echo "::error::index.html missing versioned app.js"; exit 1; }
          if grep -Eq 'src="/src/|/node_modules/' index.html; then
            echo "::error::index.html references a build-only path"; exit 1
          fi
          APP_VER=$(grep -oE 'APP_VERSION = "[0-9]+\.[0-9]+\.[0-9]+"' app.js | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "OpsBoard version: $APP_VER"
          grep -q "## \[$APP_VER\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no entry for $APP_VER"; exit 1; }
          if grep -RniE 'console\.(log|debug)\(|debugger;|FIXME' app.js; then
            echo "::error::debug marker found in app.js"; exit 1
          fi
          echo "OpsBoard guardrails passed"

      - name: Fail if the committed artifact is stale
        run: |
          # dist/ is committed and served verbatim, so it must always match a fresh build
          # of outputs/. Otherwise the live site silently diverges from the source.
          npm run build
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            git diff --stat -- dist
            exit 1
          fi
          echo "Committed artifact matches a fresh build."

      - name: Verify deploy artifact
        run: |
          test -f dist/index.html
          test -f dist/sitemap.xml
          test -f dist/tools/techniek-opsboard/index.html
          test -f dist/tools/techniek-opsboard/app.js
          test -f dist/tools/techniek-opsboard/assets/knowledge-corpus.js
          test -f dist/tools/techniek-twinsim-studio/index.html
          test -f dist/tools/precisionflow/index.html
          test -n "$(find dist/tools/precisionflow/assets -name 'index-*.js' -print -quit)"
          test -f dist/tools/greg-brown-site/index.html
          # The Digital Twin chat is a Cloudflare Pages Function. If this is ever
          # missing the career page still loads but the chat reports itself offline.
          test -f functions/tools/greg-brown-site/api/chat.js
          test -f functions-lib/twin-knowledge.js
          # Tools retained in the repo for later work must stay out of the artifact.
          for unpublished in flange-capacity blueledger-georgia blueledger-west _shared; do
            if [ -e "dist/tools/$unpublished" ]; then
              echo "::error::unpublished tool $unpublished leaked into dist"; exit 1
            fi
          done
          # Career site must use relative asset paths so it serves from the
          # apex domain and from Cloudflare preview deployments alike.
          if grep -q '"/Techniek_Codex/' dist/tools/greg-brown-site/index.html; then
            echo "::error::greg-brown-site has host-specific absolute asset paths"; exit 1
          fi
